[package]
name = "librespot-bridge"
version = "0.1.0"
edition = "2021"

[lib]
# staticlib is for the C ABI consumer (Phase 2); rlib keeps cargo tests fast.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned per plans.md Phase 0 + 1.16 (exact rev + flags recorded in
# docs/DECISIONS.md). Unused until Phase 1.
librespot = { git = "https://github.com/librespot-org/librespot", rev = "a1b66d3c8a14e55a9572a9e17467150dca618c9a" }

# Phase 1 headless receiver (src/bin/headless.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
# Phase 6 artwork: JPEG decode (CDN bytes) + resize + BMP encode for the
# C-verifiable disk cache. No default features to keep the tree small.
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp"] }
# Phase 8 search: PKCE OAuth (same pinned rev) + HTTPS + JSON. reqwest
# defaults (SChannel TLS) match the Phase 0 native-tls choice; all three
# were already compiled as transitive deps of librespot-oauth.
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "a1b66d3c8a14e55a9572a9e17467150dca618c9a" }
reqwest = "0.12"
serde_json = "1"
